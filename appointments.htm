<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4123a">
  <title>My Appointments â€” UnitedCare</title>
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="appointments">
  <div id="site-nav"></div>

  <main class="container py-5">
    <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <div class="section-eyebrow mb-2">Patient records</div>
        <h1 class="display-6 mb-0">My health dashboard</h1>
      </div>
      <a href="doctors.htm" class="btn btn-primary"><i class="bi bi-plus-lg me-1" aria-hidden="true"></i>New appointment</a>
    </header>

    <div class="row g-4">
      <section class="col-lg-7" aria-labelledby="apptTitle">
        <div class="card-hc p-4 h-100">
          <h2 class="h5 mb-3" id="apptTitle">Appointments</h2>
          <div id="apptList" class="d-grid gap-3"></div>
        </div>
      </section>
      <section class="col-lg-5" aria-labelledby="histTitle">
        <div class="card-hc p-4 h-100">
          <h2 class="h5 mb-3" id="histTitle">Prediction history</h2>
          <div id="histList" class="d-grid gap-2"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if (requireLogin("appointments.htm")) {
      const user = Store.currentUser();
      const fmtDate = (d) => new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

      function renderAppts() {
        const mine = Store.appointments().filter((a) => a.email === user.email);
        const list = document.getElementById("apptList");
        if (!mine.length) {
          list.innerHTML = `<div class="text-center py-5"><div class="icon-tile mx-auto mb-3"><i class="bi bi-calendar-x" aria-hidden="true"></i></div><p class="text-muted-hc mb-3">No appointments yet.</p><a href="doctors.htm" class="btn btn-outline-primary btn-sm">Find a specialist</a></div>`;
          return;
        }
        list.innerHTML = mine.map((a) => {
          const doc = DOCTORS.find((d) => d.id === a.doctorId);
          const cancelled = a.status === "Cancelled";
          return `
          <div class="d-flex flex-wrap align-items-center gap-3 p-3 border rounded-3 ${cancelled ? "opacity-50" : ""}">
            <span class="avatar" style="background:${doc ? doc.color : "#101828"}">${initials(a.doctor)}</span>
            <div class="flex-grow-1">
              <div class="fw-bold">${escapeHtml(a.doctor)}</div>
              <div class="small text-muted-hc">${escapeHtml(a.specialty)} Â· ${escapeHtml(a.hospital)}</div>
              <div class="small fw-semibold mt-1"><i class="bi bi-calendar3 me-1" aria-hidden="true"></i>${fmtDate(a.date)} Â· ${a.slot}</div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="badge ${cancelled ? "text-bg-secondary" : "text-bg-success"}">${a.status}</span>
              ${cancelled ? "" : `<button class="btn btn-sm btn-outline-secondary" data-cancel="${a.id}">Cancel</button>`}
            </div>
          </div>`;
        }).join("");
      }

      function renderHistory() {
        const mine = Store.predictions().filter((p) => p.email === user.email);
        const list = document.getElementById("histList");
        if (!mine.length) {
          list.innerHTML = `<div class="text-center py-5"><div class="icon-tile mx-auto mb-3"><i class="bi bi-clipboard2-pulse" aria-hidden="true"></i></div><p class="text-muted-hc mb-3">No predictions yet.</p><a href="predict.htm" class="btn btn-outline-primary btn-sm">Run assessment</a></div>`;
          return;
        }
        list.innerHTML = mine.map((p) => `
          <div class="d-flex justify-content-between align-items-center p-3 border rounded-3 risk-${p.level.toLowerCase()}">
            <div>
              <div class="fw-bold small">${fmtDate(p.date)}</div>
              <div class="small text-muted-hc">${p.symptoms} symptoms Â· ${p.pct}% probability</div>
            </div>
            <span class="risk-pill small">${p.level}</span>
          </div>`).join("");
      }

      document.getElementById("apptList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-cancel]");
        if (!btn) return;
        const appts = Store.appointments().map((a) => (a.id === Number(btn.dataset.cancel) ? { ...a, status: "Cancelled" } : a));
        Store.set("appointments", appts);
        renderAppts();
        showToast("Appointment cancelled", "secondary");
      });

      renderAppts();
      renderHistory();
    }
  </script>
</body>
</html>
