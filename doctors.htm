<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4123a">
  <title>Find a Specialist â€” UnitedCare</title>
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="doctors">
  <div id="site-nav"></div>

  <main class="container py-5">
    <header class="row g-3 align-items-end mb-4">
      <div class="col-lg-6">
        <div class="section-eyebrow mb-2">Doctor recommendation</div>
        <h1 class="display-6 mb-2">Find the right specialist</h1>
        <p class="text-muted-hc mb-0">Hematologists, Oncologists, Pathologists and General Physicians available for online booking.</p>
      </div>
      <div class="col-lg-6">
        <div class="row g-2">
          <div class="col-sm-7">
            <label for="search" class="visually-hidden">Search doctors</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-search" aria-hidden="true"></i></span>
              <input type="search" id="search" class="form-control border-start-0" placeholder="Search by name or hospital">
            </div>
          </div>
          <div class="col-sm-5">
            <label for="specialty" class="visually-hidden">Filter by specialty</label>
            <select id="specialty" class="form-select">
              <option value="">All specialties</option>
              <option>Hematologist</option>
              <option>Oncologist</option>
              <option>Pathologist</option>
              <option>General Physician</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="row g-4" id="doctorGrid" aria-live="polite"></div>
    <p class="text-center text-muted-hc py-5 d-none" id="noResults">No doctors match your search.</p>
  </main>

  <div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content border-0 rounded-4" id="bookForm" novalidate>
        <div class="modal-header border-0 pb-0">
          <h2 class="modal-title h5" id="bookTitle">Book appointment</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex align-items-center gap-3 p-3 rounded-3 bg-light mb-3" id="bookDoctor"></div>
          <div class="mb-3">
            <label for="bookDate" class="form-label small fw-semibold">Date</label>
            <input type="date" id="bookDate" class="form-control" required>
            <div class="invalid-feedback">Choose a date.</div>
          </div>
          <fieldset class="mb-3">
            <legend class="form-label small fw-semibold">Time slot</legend>
            <div class="d-flex flex-wrap gap-2" id="slotGroup"></div>
            <div class="small text-danger mt-1 d-none" id="slotError">Pick a time slot.</div>
          </fieldset>
          <div class="mb-1">
            <label for="bookNote" class="form-label small fw-semibold">Reason for visit <span class="text-muted-hc fw-normal">(optional)</span></label>
            <textarea id="bookNote" class="form-control" rows="2" placeholder="e.g. High risk result from AI assessment"></textarea>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Confirm booking</button>
        </div>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const grid = document.getElementById("doctorGrid");
    const searchEl = document.getElementById("search");
    const specEl = document.getElementById("specialty");
    if (params.get("specialty")) specEl.value = params.get("specialty");

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const spec = specEl.value;
      const list = DOCTORS.filter((d) =>
        (!spec || d.specialty === spec) &&
        (!q || d.name.toLowerCase().includes(q) || d.hospital.toLowerCase().includes(q))
      );
      document.getElementById("noResults").classList.toggle("d-none", list.length > 0);
      grid.innerHTML = list.map((d) => `
        <div class="col-md-6 col-lg-4 col-xl-3">
          <article class="card-hc card-hover p-4 h-100 d-flex flex-column">
            <div class="d-flex align-items-center gap-3 mb-3">
              <span class="avatar" style="background:${d.color}">${initials(d.name)}</span>
              <div>
                <h2 class="h6 fw-bold mb-0">${d.name}</h2>
                <span class="badge rounded-pill bg-primary-soft text-primary-hc fw-semibold mt-1">${d.specialty}</span>
              </div>
            </div>
            <ul class="list-unstyled small text-muted-hc d-grid gap-1 mb-4">
              <li><i class="bi bi-hospital me-2" aria-hidden="true"></i>${d.hospital}</li>
              <li><i class="bi bi-briefcase me-2" aria-hidden="true"></i>${d.exp} years experience</li>
              <li><i class="bi bi-star-fill text-warning me-2" aria-hidden="true"></i>${d.rating} rating</li>
            </ul>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="fw-bold">â‚¹${d.fee}<span class="small text-muted-hc fw-normal"> / visit</span></span>
              <button class="btn btn-primary btn-sm px-3" data-book="${d.id}">Book</button>
            </div>
          </article>
        </div>`).join("");
    }

    const modal = new bootstrap.Modal(document.getElementById("bookModal"));
    const bookForm = document.getElementById("bookForm");
    const dateEl = document.getElementById("bookDate");
    const today = new Date();
    const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    dateEl.min = iso(today);
    let currentDoctor = null;

    document.getElementById("slotGroup").innerHTML = SLOTS.map((s, i) => `
      <span class="slot-btn"><input type="radio" name="slot" id="slot${i}" value="${s}"><label for="slot${i}">${s}</label></span>`).join("");

    function openBooking(id) {
      if (!requireLogin("doctors.htm?book=" + id)) return;
      currentDoctor = DOCTORS.find((d) => d.id === Number(id));
      if (!currentDoctor) return;
      document.getElementById("bookDoctor").innerHTML = `
        <span class="avatar" style="background:${currentDoctor.color}">${initials(currentDoctor.name)}</span>
        <div><div class="fw-bold">${currentDoctor.name}</div><div class="small text-muted-hc">${currentDoctor.specialty} Â· ${currentDoctor.hospital}</div></div>`;
      bookForm.reset();
      bookForm.classList.remove("was-validated");
      document.getElementById("slotError").classList.add("d-none");
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
      dateEl.value = iso(tomorrow);
      modal.show();
    }

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-book]");
      if (btn) openBooking(btn.dataset.book);
    });
    searchEl.addEventListener("input", render);
    specEl.addEventListener("change", render);

    bookForm.addEventListener("submit", (e) => {
      e.preventDefault();
      bookForm.classList.add("was-validated");
      const slot = bookForm.querySelector('input[name="slot"]:checked');
      document.getElementById("slotError").classList.toggle("d-none", !!slot);
      if (!bookForm.checkValidity() || !slot) return;
      const user = Store.currentUser();
      const appts = Store.appointments();
      const clash = appts.some((a) => a.doctorId === currentDoctor.id && a.date === dateEl.value && a.slot === slot.value && a.status !== "Cancelled");
      if (clash) { showToast("That slot is already booked. Choose another.", "danger"); return; }
      appts.unshift({
        id: Date.now(),
        doctorId: currentDoctor.id,
        doctor: currentDoctor.name,
        specialty: currentDoctor.specialty,
        hospital: currentDoctor.hospital,
        patient: user.name,
        email: user.email,
        date: dateEl.value,
        slot: slot.value,
        note: document.getElementById("bookNote").value.trim(),
        status: "Confirmed",
      });
      Store.set("appointments", appts);
      modal.hide();
      showToast(`Appointment confirmed with ${currentDoctor.name}`);
    });

    render();
    if (params.get("book")) openBooking(params.get("book"));
  </script>
</body>
</html>
